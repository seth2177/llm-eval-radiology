[project]
name = "llm-eval-radiology"
version = "0.1.0"
description = "Score an imaging AI detector and the LLM that writes its report impression against ground truth"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
